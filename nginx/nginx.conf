user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}

#TODO: criar upstreams aqui


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;  # não exibe versão do NGINX

    ## Captura de Ip:
    set_real_ip_from 172.18.0.1;
    set_real_ip_from 192.168.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';


    log_format realip_debug
    'remote_addr=$remote_addr '
    'realip_remote_addr=$realip_remote_addr '
    'xff="$http_x_forwarded_for" '
    'xreal="$http_x_real_ip" '
    'host="$host" '
    'request="$request"';

    access_log /dev/stdout realip_debug;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;

    server {
        listen 0.0.0.0:80;
        listen [::]:80;

        # ACME Challenge - encaminha para a máquina central ACME
        location ^~ /.well-known/acme-challenge/ {
            proxy_pass http://192.168.0.64;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_redirect off;
        }

        # Frontend
        location /qcyber {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Api principal
        location /qcyber/api/ {
            proxy_pass http://api-principal:8000/qcyber/api/;  # cuidado com esse endereço aqui!
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            #proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Api de analise
        #location /api-quantum/ {
        #    proxy_pass http://localhost:5000/api-quantum/;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_set_header X-Forwarded-Proto $scheme;
        #}
    }

}
